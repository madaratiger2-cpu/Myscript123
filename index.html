<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Vault Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">
    <nav class="max-w-5xl mx-auto flex justify-between items-center mb-8 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
        <h1 class="text-2xl font-bold text-cyan-400"><i class="fa-solid fa-vault mr-2"></i>Lua Vault</h1>
        <button onclick="showDashboard(true)" class="text-slate-300 hover:text-white transition"><i class="fa-solid fa-home mr-1"></i> Dashboard</button>
    </nav>

    <div id="toast" class="fixed top-5 right-5 text-white px-6 py-3 rounded shadow-lg transform transition-transform duration-300 translate-x-full z-50 flex items-center">
        <i class="fa-solid fa-circle-check mr-2" id="toastIcon"></i> <span id="toastMsg">Success</span>
    </div>

    <div id="dashboardView" class="max-w-5xl mx-auto space-y-6">
        <div class="glass-panel p-6 rounded-xl shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-white"><i class="fa-solid fa-cloud-arrow-up text-cyan-400 mr-2"></i>Upload Script</h2>
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <input type="file" id="fileInput" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-900 file:text-cyan-300 hover:file:bg-cyan-800 transition">
                <button onclick="uploadFile()" id="uploadBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white px-8 py-2 rounded-lg font-bold transition whitespace-nowrap shadow-lg shadow-cyan-500/30 w-full md:w-auto">
                    <i class="fa-solid fa-upload mr-2"></i>Upload
                </button>
            </div>
        </div>

        <div class="glass-panel rounded-xl shadow-xl overflow-hidden">
            <div class="p-4 bg-slate-800 border-b border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-xl font-semibold text-white whitespace-nowrap"><i class="fa-solid fa-list text-cyan-400 mr-2"></i>Scripts</h2>
                <div class="relative w-full max-w-md">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="searchInput" onkeyup="filterSearch()" placeholder="Search ID..." class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-cyan-400 transition">
                </div>
                <button onclick="loadFiles(true)" id="refreshBtn" class="text-cyan-400 hover:text-cyan-300 whitespace-nowrap bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded transition"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <tbody id="fileList" class="divide-y divide-slate-700/50">
                        <tr><td class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner spin mr-2"></i>Loading live data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="editView" class="max-w-5xl mx-auto glass-panel p-6 rounded-xl shadow-xl hidden">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h2 class="text-2xl font-bold text-white"><i class="fa-solid fa-pen-to-square text-yellow-400 mr-2"></i>Edit Script</h2>
                <div class="flex gap-4 mt-2 items-center">
                    <p class="text-sm text-slate-400">ID: <span id="editIdDisplay" class="font-mono text-cyan-400 bg-slate-800 px-2 py-1 rounded select-all"></span></p>
                    <input type="text" id="editFileName" class="bg-slate-800 text-slate-300 text-sm border border-slate-600 rounded px-2 py-1 focus:outline-none focus:border-cyan-400">
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="copyCode()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg transition text-sm"><i class="fa-solid fa-copy"></i></button>
                <button onclick="showDashboard(false)" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg transition text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <div class="mb-4 bg-slate-800 p-4 rounded-lg border border-slate-600 flex flex-col md:flex-row justify-between items-center gap-4">
            <label class="text-sm font-medium text-slate-300 whitespace-nowrap"><i class="fa-solid fa-file-import mr-1 text-yellow-400"></i> Replace File:</label>
            <input type="file" id="replaceFileInput" onchange="loadReplaceFile(event)" class="block w-full text-sm text-slate-400 file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:bg-yellow-900/50 file:text-yellow-300 hover:file:bg-yellow-900 cursor-pointer transition">
        </div>

        <textarea id="editContent" spellcheck="false" class="w-full bg-[#1e1e1e] border border-slate-600 rounded-lg p-4 text-[#d4d4d4] font-mono text-sm focus:outline-none focus:border-cyan-400 mb-4 resize-y" style="height: 50vh;"></textarea>
        <input type="hidden" id="editFileId">
        <button onclick="saveEdit()" id="saveBtn" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white px-6 py-3 rounded-lg font-bold transition shadow-lg shadow-yellow-500/30">Save & Update Live</button>
    </div>

    <script>
        const API_URL = '/.netlify/functions/api';
        
        // BROWSER MEMORY: Netlify ke slow hone par humari khud ki pending list kaam aayegi
        let localPendingFiles = JSON.parse(localStorage.getItem('pending_files') || '[]');

        async function fetchLive(url, options = {}) {
            const liveUrl = new URL(url, window.location.origin);
            liveUrl.searchParams.append('_t', Date.now());
            return fetch(liveUrl.toString(), { 
                ...options, 
                headers: { ...options.headers, 'Cache-Control': 'no-cache, no-store', 'Pragma': 'no-cache' },
                cache: 'no-store' 
            });
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            const icon = document.getElementById('toastIcon');
            toast.className = `fixed top-5 right-5 text-white px-6 py-3 rounded shadow-lg transform transition-transform duration-300 z-50 flex items-center ${isError ? 'bg-red-500' : 'bg-green-500'}`;
            icon.className = isError ? 'fa-solid fa-circle-exclamation mr-2' : 'fa-solid fa-circle-check mr-2';
            msgEl.innerText = message;
            toast.classList.remove('translate-x-full');
            setTimeout(() => toast.classList.add('translate-x-full'), 2500);
        }

        function showDashboard(forceReload = false) {
            document.getElementById('editView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            if(forceReload) loadFiles();
        }

        function filterSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.file-row').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        }

        function copyRawLink(id) {
            const link = `${window.location.origin}${API_URL}?raw=${id}`;
            navigator.clipboard.writeText(link).then(() => showToast("Live Link Copied!"));
        }

        function openRawLink(id) {
            const freshUrl = `${API_URL}?raw=${id}&_t=${Date.now()}`;
            window.open(freshUrl, '_blank');
        }

        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('editContent').value).then(() => showToast("Code Copied!"));
        }

        function renderRow(id) {
            return `
                <tr class="file-row hover:bg-slate-700/30 transition group flex flex-col md:flex-row justify-between items-center p-4 border-b border-slate-700/50" id="row-${id}">
                    <td class="font-mono text-cyan-400 font-bold text-lg select-all w-full md:w-auto mb-4 md:mb-0">${id}</td>
                    <td class="flex flex-wrap gap-2 justify-end w-full md:w-auto">
                        <button onclick="copyRawLink('${id}')" class="bg-purple-600/20 text-purple-400 hover:bg-purple-600 hover:text-white px-3 py-2 rounded transition text-sm"><i class="fa-solid fa-link mr-1"></i>Copy Link</button>
                        <button onclick="openRawLink('${id}')" class="bg-green-600/20 text-green-400 hover:bg-green-600 hover:text-white px-3 py-2 rounded transition text-sm"><i class="fa-solid fa-file-code mr-1"></i>Raw</button>
                        <button onclick="openEdit('${id}')" class="bg-yellow-600/20 text-yellow-400 hover:bg-yellow-600 hover:text-white px-3 py-2 rounded transition text-sm"><i class="fa-solid fa-pen mr-1"></i>Edit</button>
                        <button onclick="deleteFile('${id}')" class="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white px-3 py-2 rounded transition text-sm"><i class="fa-solid fa-trash mr-1"></i>Delete</button>
                    </td>
                </tr>
            `;
        }

        async function loadFiles(manualRefresh = false) {
            const listEl = document.getElementById('fileList');
            const refreshBtn = document.getElementById('refreshBtn');
            if (manualRefresh) refreshBtn.innerHTML = '<i class="fa-solid fa-spinner spin"></i>';

            try {
                const res = await fetchLive(API_URL);
                if (!res.ok) throw new Error("Server Error");
                let blobs = await res.json();
                if (!Array.isArray(blobs)) blobs = [];
                
                const apiKeys = blobs.map(b => b.key);

                // Asli Jadoo: Agar list me pending file sach me aagayi, to browser memory se hata do
                localPendingFiles = localPendingFiles.filter(id => !apiKeys.includes(id));
                localStorage.setItem('pending_files', JSON.stringify(localPendingFiles));

                // Ab Dono list (Netlify + Browser Memory) ko milao
                const combinedList = [...localPendingFiles.map(id => ({ key: id })), ...blobs];

                if (combinedList.length === 0) {
                    listEl.innerHTML = `<tr><td class="p-8 text-center text-slate-500"><i class="fa-solid fa-box-open text-2xl mb-2 block"></i> No scripts found. Upload one!</td></tr>`;
                } else {
                    listEl.innerHTML = combinedList.map(blob => renderRow(blob.key)).join('');
                }
                filterSearch();
            } catch (err) {
                listEl.innerHTML = `<tr><td class="p-4 text-red-400 text-center"><i class="fa-solid fa-triangle-exclamation mr-2"></i> Error loading live data</td></tr>`;
            } finally {
                if (manualRefresh) refreshBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
            }
        }

        // ==========================================
        // UPLOAD FIX (INSTANT + BROWSER MEMORY)
        // ==========================================
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const btn = document.getElementById('uploadBtn');
            if (!fileInput.files.length) return showToast("Select a file first!", true);
            
            btn.innerHTML = '<i class="fa-solid fa-spinner spin mr-2"></i>Uploading...';
            btn.disabled = true;
            
            const file = fileInput.files[0];
            // ID yahin turant create kar liya
            const newId = Math.random().toString(36).substring(2, 10);
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    fileInput.value = "";
                    
                    // 1. Browser Memory me save karo (Taaki reload karne pe ud na jaye)
                    localPendingFiles.unshift(newId);
                    localStorage.setItem('pending_files', JSON.stringify(localPendingFiles));
                    
                    // 2. Turant HTML me add kar do, Netlify ki API ka wait hi nahi karna
                    const listEl = document.getElementById('fileList');
                    if (listEl.innerText.includes('No scripts found') || listEl.innerText.includes('Loading')) {
                        listEl.innerHTML = ''; 
                    }
                    listEl.insertAdjacentHTML('afterbegin', renderRow(newId));

                    // 3. Background me file upload hone do (Hamesha PUT request use karo jisme custom ID jaye)
                    const res = await fetchLive(API_URL, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: newId, filename: file.name, content: e.target.result })
                    });
                    if (!res.ok) throw new Error("Upload failed");
                    
                    showToast("Uploaded Successfully!");
                } catch (err) {
                    showToast("Upload Failed", true);
                    // Error aaya toh list se hatao
                    document.getElementById(`row-${newId}`)?.remove();
                    localPendingFiles = localPendingFiles.filter(id => id !== newId);
                    localStorage.setItem('pending_files', JSON.stringify(localPendingFiles));
                } finally {
                    btn.innerHTML = '<i class="fa-solid fa-upload mr-2"></i>Upload';
                    btn.disabled = false;
                }
            };
            reader.readAsText(file);
        }

        function loadReplaceFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('editContent').value = e.target.result;
                document.getElementById('editFileName').value = file.name;
                showToast("File loaded into editor!");
            };
            reader.readAsText(file);
        }

        async function openEdit(id) {
            try {
                showToast("Loading script...");
                const res = await fetchLive(`${API_URL}?id=${id}`);
                if (!res.ok) throw new Error("Fetch failed");
                const data = await res.json();
                
                document.getElementById('dashboardView').classList.add('hidden');
                document.getElementById('editView').classList.remove('hidden');
                document.getElementById('editIdDisplay').innerText = data.id;
                document.getElementById('editFileId').value = data.id;
                document.getElementById('editFileName').value = data.filename || `script_${data.id}.lua`;
                document.getElementById('editContent').value = data.content;
                document.getElementById('replaceFileInput').value = ""; 
            } catch (err) {
                showToast("Failed to load script data.", true);
            }
        }

        async function saveEdit() {
            const id = document.getElementById('editFileId').value;
            const filename = document.getElementById('editFileName').value;
            const content = document.getElementById('editContent').value;
            const btn = document.getElementById('saveBtn');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner spin mr-2"></i>Saving...';
            btn.disabled = true;
            
            try {
                const res = await fetchLive(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, filename, content })
                });
                if (!res.ok) throw new Error("Save failed");
                
                showToast("Updated Live!");
                // Faltu loading se bachne ke liye direct Dashboard bina API reload ke
                showDashboard(false); 
            } catch (err) {
                showToast("Error updating file.", true);
            } finally {
                btn.innerHTML = "Save & Update Live";
                btn.disabled = false;
            }
        }

        async function deleteFile(id) {
            if (!confirm(`Are you sure you want to delete '${id}'?`)) return;
            
            // Delete dabte hi HTML se uda do
            const row = document.getElementById(`row-${id}`);
            if(row) row.remove();
            
            // Browser memory se bhi uda do varna refresh pe wapas aa jayega
            localPendingFiles = localPendingFiles.filter(fileId => fileId !== id);
            localStorage.setItem('pending_files', JSON.stringify(localPendingFiles));
            
            try {
                const res = await fetchLive(API_URL, { 
                    method: 'DELETE', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id }) 
                });
                
                if (!res.ok) throw new Error("Delete failed");
                showToast("Deleted Successfully");
            } catch (err) {
                showToast("Delete Failed", true);
                loadFiles(true); 
            }
        }

        loadFiles(true);
    </script>
</body>
</html>
